name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f GOVERNANCE.md
          test -f SECURITY_NOTES.md
          test -f ADMIN_DASHBOARD.md
          test -f CHANGELOG.md
          test -f .gitignore
          test -d app
          test -d database
          test -d docs
          test -d public
          test -d scripts
          test -d tests
          test -d deployment

      - name: Confirm no environment files committed
        run: |
          if find . -name ".env" -o -name ".env.local" -o -name ".env.production" | grep .; then
            echo "Real environment file found. Do not commit secrets."
            exit 1
          fi